name: Pacer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make python3 python3-yaml python3-pandas python3-numpy python3-scipy

      - name: Build all targets
        run: make all

      - name: Run unit tests
        run: |
          ./bin/test_phase_detector
          ./bin/test_rapl_wraparound
          python3 tests/test_stats.py
          python3 tests/test_harness_guards.py
